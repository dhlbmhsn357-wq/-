name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit-and-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Syntax / static checks
        run: npm run check
      - name: Unit + database (PGlite) tests
        run: npm test
      - name: Dependency audit
        # The app ships ZERO runtime deps (dependencies: {}); everything is build-time dev tooling
        # (Capacitor CLI etc.) that never reaches the web bundle or the APK. Audit what actually ships.
        run: npm audit --omit=dev --audit-level=high

  postgres:
    name: postgres-concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Migrations from scratch + real concurrent commits
        run: npm run test:pg

  # Required gate: Chromium desktop + mobile emulation run the full E2E suite.
  e2e:
    name: e2e-${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Best-effort Safari-like coverage (NOT real iOS). WebKit is slow/finicky with service workers on
  # Linux CI, so it is non-blocking and time-capped; it excludes the SW-update spec.
  e2e-webkit:
    name: e2e-webkit-safari-like
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Run E2E (webkit, non-SW specs)
        run: >-
          npx playwright test --project=webkit
          tests/e2e/specs/core-functional.spec.mjs
          tests/e2e/specs/multi-device.spec.mjs
          tests/e2e/specs/reset-import-recovery.spec.mjs
          tests/e2e/specs/notifications.spec.mjs
          tests/e2e/specs/security.spec.mjs
          tests/e2e/specs/responsive-rtl.spec.mjs
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-webkit, path: "test-results/", retention-days: 7 }
